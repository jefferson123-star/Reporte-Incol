<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Incol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra oscura de agencia arriba, tarjeta de presupuesto, filtros, métricas, análisis, proyección y tablas en una columna */
:root{
  --bg:#f3f3ef; --panel:#ffffff; --panel-2:#f7f7f3; --ink:#17181a; --muted:#6b6d70; --line:#e2e2dc;
  --bar:#17181a; --bar-ink:#f4f4f0; --accent:#ffd400; --accent-ink:#17181a;
  --ok:#1f8a4c; --ok-bg:#e3f4e9; --warn:#a86a00; --warn-bg:#fdf1d6; --bad:#c0362c; --bad-bg:#fbe4e1; --mute-bg:#ececE6;
  --s1:#e5484d; --s2:#e5484d; --s3:#f59e0b; --s4:#7c5cff; --s5:#14b8a6; --s6:#3b82f6;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root{color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--accent);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.04em;line-height:.95;font-size:15px;background:var(--accent);color:var(--accent-ink);padding:5px 8px;border-radius:3px}
.logo small{display:block;font-size:9px;letter-spacing:.18em;font-weight:600}
.tb-sub{font-size:11px;color:#b9bab5;line-height:1.2}
.tb-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;font-weight:600;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar button{background:transparent;color:var(--bar-ink);border-color:#3a3b3f}
.ai h3{margin:14px 0 4px;font-size:16px}.ai p{margin:6px 0}.ai ul{margin:4px 0 8px;padding-left:20px;display:grid;gap:4px}.ai .src{font-size:12px;color:var(--muted);margin-top:10px}.ai-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:18px 48px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1;margin:0;letter-spacing:-.02em}
.hero .kicker{display:inline-block;border-top:4px solid var(--accent);padding-top:6px;font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:700;text-transform:uppercase}
.hero .sub{color:var(--muted);margin-top:4px}
.budget{display:grid;gap:3px;margin-top:16px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.budget .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.budget .line{font-variant-numeric:tabular-nums}
.green{color:var(--ok);font-weight:600}
.period{text-align:right}
.period .m{font-family:var(--display);font-weight:700;font-size:20px;text-transform:capitalize}
.period .d{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}
.sec-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:11px;letter-spacing:.1em;padding:4px 9px;border-radius:4px;margin-bottom:14px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{background:var(--panel-2);border-radius:8px;padding:11px 13px;border-left:3px solid var(--s);min-width:0}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.tile .h{font-size:11.5px;color:var(--muted);margin-top:2px}
.analysis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.box h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;width:max-content;max-width:100%}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--mute-bg);color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line);padding-bottom:5px}
.kv span:first-child{color:var(--muted)}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px}
.muted{color:var(--muted)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bar-track{height:14px;background:var(--panel-2);border-radius:4px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--ink)}
.bar-fill.acc{background:var(--accent)} .bar-fill.ghost{background:repeating-linear-gradient(45deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.55}
.bar-fill.okc{background:var(--ok)} .bar-fill.badc{background:var(--bad)}
.bar-row .r{text-align:right;font-weight:600}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.funnel{display:grid;gap:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);font-weight:700}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.name{white-space:normal;min-width:180px}
td.name small{display:block;color:var(--muted)}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:grid;gap:10px;justify-items:center}
.hist{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.hcol{display:grid;gap:4px;justify-items:center;min-width:64px;font-variant-numeric:tabular-nums;font-size:12px}
.hcol .col{width:34px;background:var(--ink);border-radius:4px 4px 0 0}
.hcol.cur .col{background:var(--accent)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);color:var(--ink);border-radius:14px;width:min(720px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:20px}
.grid-form{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:140px repeat(3,minmax(0,1fr));gap:8px;align-items:end}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted)}
.msg{font-size:13px;padding:8px 12px;border-radius:8px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px}
.drop.on{border-color:var(--accent)}
textarea{width:100%;min-height:260px;font-family:var(--mono);font-size:12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.reports-list{display:grid;gap:6px}
.rep{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--line);padding-block:8px}
.rep .grow{flex:1;min-width:200px}
@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}.period{text-align:left}
  .bar-row{grid-template-columns:100px minmax(0,1fr) 84px}
  .prow{grid-template-columns:1fr 1fr}.prow .pn{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.bar-fill{transition:width .4s ease}}
</style>
</head>
<body>


<header class="topbar">
  <div class="wrap">
    <div class="logo">BRAND<br>MOTION<small>LAB</small></div>
    <div class="tb-sub">Reportes<br>Incol</div>
    <div class="tb-actions">
      <button id="btnBudget" type="button">Registrar presupuesto</button>
      <button id="btnUpload" type="button" class="primary">Cargar informe</button>
      <button id="btnText" type="button">Copiar resumen</button>
      <button id="btnGh" type="button">Conectar GitHub</button>
    </div>
  </div>
</header>

<div class="wrap">
<main>
  <section class="card hero" aria-labelledby="ttl">
    <div>
      <div class="kicker">Constructora</div>
      <h1 id="ttl">Incol</h1>
      <div class="sub" id="subTtl">Reporte de campañas digitales · Meta Ads</div>
      <div class="budget">
        <div class="lbl">Presupuesto mensual de pauta</div>
        <div class="big" id="bTotal">—</div>
        <div class="line green" id="bRemain">—</div>
        <div class="line" id="bDaily">—</div>
        <div class="line" id="bGoal">—</div>
        <div class="line muted" id="bScope">—</div>
      </div>
    </div>
    <div class="period">
      <div class="m" id="pMonth">—</div>
      <div class="d" id="pDate">—</div>
    </div>
  </section>

  <section class="card filters" aria-label="Filtros">
    <span class="lbl">Proyecto</span><div class="chips" id="projChips"></div>
    <span class="lbl">Mes</span><div class="chips" id="monthChips"></div>
  </section>

  <div id="body"></div>
</main>
</div>

<div id="overlay" class="ov" hidden></div>

<script>
(function(){
const DEFAULT_PROJECTS=[
  {id:"xua",name:"XUA",keywords:["XUA"]},
  {id:"qanvas",name:"Qanvas",keywords:["QANVAS","CANVAS"]},
  {id:"steel2",name:"Steel 2",keywords:["STEEL"]},
  {id:"mirador",name:"Mirador del Portal",keywords:["MIRADOR","PORTAL"]}
];
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MES3=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const nf0=new Intl.NumberFormat("es-CO",{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>v==null||!isFinite(v)?"—":"$ "+nf0.format(Math.round(v));
const int=v=>v==null||!isFinite(v)?"—":nf0.format(Math.round(v));
const pct=v=>v==null||!isFinite(v)?"—":nf2.format(v)+"%";
const dec=v=>v==null||!isFinite(v)?"—":nf2.format(v);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const state={projects:DEFAULT_PROJECTS,reports:{},budgets:{},analyses:{},proj:"all",month:null,canWrite:false,db:null,ready:false};
const GH={owner:"jefferson123-star",repo:"Reporte-Incol",path:"dashboard/data.json",branch:"main"};
let ghToken="";try{ghToken=localStorage.getItem("incol.ghToken")||"";}catch(e){}
function b64dec(c){const bin=atob(c.replace(/\n/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);}
function b64enc(str){const u=new TextEncoder().encode(str);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
const ghUrl=()=>`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
const ghHead=()=>({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
async function ghGet(){const r=await fetch(ghUrl()+"?ref="+GH.branch+"&t="+Date.now(),{headers:ghHead(),cache:"no-store"});if(!r.ok)throw new Error(r.status===401?"Token inválido o vencido":r.status===404?"Sin acceso al repo con este token":"GitHub respondió "+r.status);const j=await r.json();return {sha:j.sha,data:JSON.parse(b64dec(j.content))};}
async function saveData(mut,msg){
  if(!ghToken)throw new Error("Conecta GitHub primero");
  for(let attempt=0;attempt<2;attempt++){
    const {sha,data}=await ghGet();mut(data);
    const r=await fetch(ghUrl(),{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},body:JSON.stringify({message:msg,content:b64enc(JSON.stringify(data,null,1)),sha,branch:GH.branch})});
    if(r.ok){applyData(data);return;}
    if(r.status!==409&&r.status!==422)throw new Error(r.status===403||r.status===404?"El token no tiene permiso de escritura en el repo":"GitHub respondió "+r.status);
  }
  throw new Error("Otro cambio se guardó al mismo tiempo. Intenta de nuevo.");
}
function applyData(d){if(Array.isArray(d.projects)&&d.projects.length)state.projects=d.projects;state.reports=d.reports||{};state.budgets=d.budgets||{};state.analyses=d.analyses||{};}
try{const p=localStorage.getItem("incol.proj");if(p)state.proj=p;}catch(e){}
if(location.hash.length>1)state.proj=decodeURIComponent(location.hash.slice(1));

function monthLabel(m){if(!m)return"—";const [y,mm]=m.split("-");return MES[+mm-1]+" "+y;}
function monthShort(m){const [y,mm]=m.split("-");return MES3[+mm-1]+" ’"+y.slice(2);}
function dim(m){const [y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate();}
function projName(id){const p=state.projects.find(p=>p.id===id);return p?p.name:id;}

/* ---------- parsing ---------- */
function norm(s){return String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();}
const COLS=[
 ["campaign",h=>h.includes("nombre de la campana")],
 ["adset",h=>h.includes("nombre del conjunto")],
 ["ad",h=>h.includes("nombre del anuncio")],
 ["spend",h=>h.startsWith("importe gastado")],
 ["leads",h=>h==="clientes potenciales"||h==="resultados"],
 ["resultType",h=>h.startsWith("tipo de resultado")],
 ["cpr",h=>h.startsWith("coste por resultado")||h.startsWith("costo por resultado")],
 ["convRate",h=>h.includes("tasa de conversion")],
 ["clicks",h=>h.startsWith("clics unicos en el enlace")],
 ["clicksAll",h=>h.startsWith("clics unicos (todos)")],
 ["ctr",h=>h.startsWith("ctr unico")],
 ["cpc",h=>h.startsWith("coste por clic unico")],
 ["v3s",h=>h.startsWith("reproducciones de video de 3")],
 ["vavg",h=>h.startsWith("tiempo medio de reproduccion")],
 ["freq",h=>h==="frecuencia"],
 ["reach",h=>h==="alcance"],
 ["impr",h=>h==="impresiones"],
 ["msgs",h=>h.startsWith("conversaciones con mensajes")],
 ["repStart",h=>h==="inicio del informe"],
 ["repEnd",h=>h==="fin del informe"]
];
function num(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return isFinite(v)?v:null;
  let s=String(v).trim(); if(!s||s==="-")return null;
  s=s.replace(/[^\d,.\-]/g,"");
  if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");
  else if(s.includes(","))s=s.replace(",",".");
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,"");
  const n=parseFloat(s);return isFinite(n)?n:null;
}
function dateStr(v){
  if(v==null||v==="")return null;
  if(v instanceof Date)return v.toISOString().slice(0,10);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10);}
  const s=String(v).trim(); const m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
  const m2=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m2)return m2[3]+"-"+m2[2].padStart(2,"0")+"-"+m2[1].padStart(2,"0");
  return null;
}
function parseWorkbook(wb){
  const names=[...wb.SheetNames].sort((a,b)=>(/raw/i.test(b)?1:0)-(/raw/i.test(a)?1:0));
  for(const name of names){
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    for(let r=0;r<Math.min(aoa.length,20);r++){
      const map={};
      (aoa[r]||[]).forEach((h,i)=>{const n=norm(h);if(!n)return;for(const [k,t] of COLS){if(map[k]==null&&t(n)){map[k]=i;break;}}});
      if(map.spend!=null&&(map.campaign!=null||map.adset!=null)&&Object.keys(map).length>=3){
        return {sheet:name,rows:extract(aoa.slice(r+1),map),cols:Object.keys(map)};
      }
    }
  }
  throw new Error("No encontré las columnas de Meta (necesito al menos “Nombre de la campaña” e “Importe gastado”).");
}
function extract(data,map){
  const out=[];let lastCamp="";
  const g=(row,k)=>map[k]==null?null:row[map[k]];
  for(const row of data){
    if(!row||row.every(v=>v==null||v===""))continue;
    let camp=String(g(row,"campaign")??"").trim(); if(camp)lastCamp=camp; else camp=lastCamp;
    const adset=String(g(row,"adset")??"").trim();
    if(map.adset!=null&&(!adset||norm(adset)==="all"))continue;
    if(!camp&&!adset)continue;
    const spend=num(g(row,"spend"))||0;
    const leads=num(g(row,"leads")),msgs=num(g(row,"msgs")),cpr=num(g(row,"cpr"));
    const rt=String(g(row,"resultType")??"").trim(),nrt=norm(rt);
    let kind="other";
    if(nrt.includes("conversacion")||nrt.includes("mensaje"))kind="msg";
    else if(nrt.includes("cliente")||nrt.includes("lead")||nrt.includes("formulario")||(!nrt&&leads>0))kind="lead";
    let results=0;
    if(leads>0)results=leads; else if(msgs>0)results=msgs; else if(cpr>0&&spend>0)results=Math.round(spend/cpr);
    if(kind==="other"&&results>0)kind="lead";
    let conv=num(g(row,"convRate")); if(conv!=null&&conv>1)conv=conv/100;
    let clicks=num(g(row,"clicks")); const clicksAll=num(g(row,"clicksAll"));
    const ctr=num(g(row,"ctr"));
    let impr=num(g(row,"impr")),est=false;
    if(impr==null&&ctr>0&&clicks>0){impr=clicks/(ctr/100);est=true;}
    const freq=num(g(row,"freq"));
    let reach=num(g(row,"reach"));
    if(reach==null&&impr>0&&freq>0)reach=impr/freq;
    if(spend<=0&&!results&&!clicks)continue;
    out.push({campaign:camp,adset:adset||"(sin conjunto)",ad:String(g(row,"ad")??"").trim()||null,spend,results,kind,resultType:rt||null,
      convRate:conv,clicks:clicks,clicksAll:clicksAll,ctr,impr:impr==null?null:Math.round(impr),imprEst:est,reach:reach==null?null:Math.round(reach),
      freq,v3s:num(g(row,"v3s")),vavg:num(g(row,"vavg")),repStart:dateStr(g(row,"repStart")),repEnd:dateStr(g(row,"repEnd"))});
  }
  return out;
}
function detectProject(campaign){
  const c=norm(campaign).toUpperCase();
  for(const p of state.projects){if((p.keywords||[]).some(k=>c.includes(norm(k).toUpperCase())))return p.id;}
  return null;
}

/* ---------- aggregation ---------- */
function agg(rows){
  const a={spend:0,results:0,leads:0,msgs:0,clicks:0,impr:0,reach:0,v3s:0,vW:0,opens:0,leadsConv:0,est:false,n:rows.length};
  for(const r of rows){
    a.spend+=r.spend||0;a.results+=r.results||0;
    if(r.kind==="msg")a.msgs+=r.results||0;else a.leads+=r.results||0;
    a.clicks+=r.clicks||0;a.impr+=r.impr||0;a.reach+=r.reach||0;if(r.imprEst)a.est=true;
    if(r.v3s){a.v3s+=r.v3s;if(r.vavg!=null)a.vW+=r.vavg*r.v3s;}
    if(r.kind==="lead"&&r.convRate>0&&r.results>0){a.opens+=r.results/r.convRate;a.leadsConv+=r.results;}
  }
  a.cpl=a.results?a.spend/a.results:null;
  a.cplLead=a.leads?(a.spend-sumKind(rows,"msg"))/a.leads:null;
  a.ctr=a.impr?a.clicks/a.impr*100:null;
  a.cpc=a.clicks?a.spend/a.clicks:null;
  a.cpm=a.impr?a.spend/a.impr*1000:null;
  a.freq=a.reach?a.impr/a.reach:null;
  a.conv=a.opens?a.leadsConv/a.opens*100:null;
  a.p3s=a.impr&&a.v3s?a.v3s/a.impr*100:null;
  a.vavg=a.v3s?a.vW/a.v3s:null;
  return a;
}
function sumKind(rows,k){return rows.filter(r=>r.kind===k).reduce((s,r)=>s+(r.spend||0),0);}

function reportsFor(month,proj){
  return Object.values(state.reports).filter(r=>r.month===month&&(proj==="all"||r.project===proj));
}
function rowsOf(reps){const o=[];for(const r of reps)for(const x of (r.rows||[]))o.push({...x,project:r.project});return o;}
function budgetFor(month,proj){
  const b=(state.budgets[month]||{}).projects||{};
  const ids=proj==="all"?state.projects.map(p=>p.id):[proj];
  let budget=0,goal=0,has=0,goalSet=0;
  const per={};
  for(const id of ids){const x=b[id]||{};const bud=+x.budget||0;let g=+x.goal||0;const t=+x.cplTarget||0;
    if(!g&&bud&&t)g=Math.round(bud/t);
    per[id]={budget:bud,goal:g,cplTarget:t||(bud&&g?bud/g:0)};
    budget+=bud;goal+=g;if(bud)has++;if(g)goalSet++;}
  return {budget,goal,cplTarget:goal?budget/goal:0,per,has,ids};
}

/* ---------- analysis ---------- */
function diagnose(a){
  const f=[];
  if(a.ctr!=null)f.push({k:"CTR único",v:pct(a.ctr),s:a.ctr>=1.5?"ok":a.ctr>=1?"warn":"bad",t:a.ctr>=1.5?"saludable":a.ctr>=1?"aceptable":"bajo"});
  if(a.conv!=null)f.push({k:"Tasa conversión formulario",v:pct(a.conv),s:a.conv>=20?"ok":a.conv>=10?"warn":"bad",t:a.conv>=20?"saludable":a.conv>=10?"baja":"muy baja"});
  if(a.p3s!=null)f.push({k:"% Reprod. 3 seg",v:pct(a.p3s),s:a.p3s>=25?"ok":a.p3s>=15?"warn":"bad",t:a.p3s>=25?"saludable":"baja"});
  if(a.freq!=null)f.push({k:"Frecuencia",v:dec(a.freq),s:a.freq<=2.5?"ok":a.freq<=3.5?"warn":"bad",t:a.freq<=2.5?"saludable":a.freq<=3.5?"vigilar":"alta"});
  let head,text,todo,actions;
  if(a.ctr!=null&&a.ctr<1){
    head="El anuncio no está generando clics";
    text=`El CTR único está en ${pct(a.ctr)}, por debajo del umbral saludable (1%–1,5%). El problema está antes del clic: creativo, gancho o público.`;
    todo="Renueva creativos antes de subir presupuesto";
    actions=["Probar nuevos ganchos en los primeros 3 segundos (precio desde, ubicación, metraje)","Rotar formatos: video corto, carrusel de planos, recorrido","Revisar que el público no sea demasiado amplio o frío"];
  }else if(a.conv!=null&&a.conv<20){
    head=a.ctr!=null?"Buen CTR; el cuello está en el formulario":"El cuello está en el formulario";
    text=`La tasa de conversión del formulario es ${pct(a.conv)}, baja frente al rango 20%–30%.${a.ctr!=null?` El CTR único (${pct(a.ctr)}) sí atrae clics.`:""}`;
    todo="Optimiza el formulario y el destino";
    actions=["Simplificar campos y fricción del formulario","Revisar claridad de la oferta (precio, subsidio, entrega)","Probar CTA y prueba social en el formulario"];
  }else if(a.freq!=null&&a.freq>3.5){
    head="El público se está saturando";
    text=`La frecuencia va en ${dec(a.freq)}: las mismas personas ven el anuncio demasiadas veces y el costo tiende a subir.`;
    todo="Refresca creativos o amplía públicos";
    actions=["Subir 2–3 creativos nuevos en los conjuntos ganadores","Ampliar edad o intereses en el conjunto más saturado","Excluir a quienes ya enviaron formulario"];
  }else if(a.p3s!=null&&a.p3s<25){
    head="Los videos no retienen";
    text=`Solo el ${pct(a.p3s)} de las impresiones llega a 3 segundos de video. El gancho inicial no está deteniendo el scroll.`;
    todo="Trabaja el gancho de los primeros 3 segundos";
    actions=["Abrir con el dato más fuerte (precio, ubicación, entrega)","Texto grande en pantalla desde el segundo 0","Probar versiones de 6–10 s"];
  }else{
    head="Las métricas están sanas";
    text="CTR, conversión y frecuencia están en rango. Hay espacio para escalar los conjuntos con mejor costo por resultado.";
    todo="Escala lo que funciona";
    actions=["Subir 15%–20% el presupuesto de los conjuntos ganadores cada 2–3 días","Duplicar el mejor conjunto con un creativo nuevo","Mantener 20%–30% del presupuesto para pruebas"];
  }
  return {flags:f,head,text,todo,actions};
}
function adsetTable(rows,bud){
  const g={};
  for(const r of rows){const k=r.project+"|"+r.campaign+"|"+r.adset;(g[k]=g[k]||{project:r.project,campaign:r.campaign,adset:r.adset,rows:[]}).rows.push(r);}
  const list=Object.values(g).map(x=>{const a=agg(x.rows);const kind=x.rows.some(r=>r.kind==="msg")?"msg":"lead";return {...x,a,kind};});
  const total=list.reduce((s,x)=>s+x.a.spend,0);
  const avg={};
  for(const k of ["lead","msg"]){const L=list.filter(x=>x.kind===k);const s=L.reduce((t,x)=>t+x.a.spend,0),r=L.reduce((t,x)=>t+x.a.results,0);avg[k]=r?s/r:null;}
  for(const x of list){
    const tgt=x.kind==="lead"?(bud.per[x.project]||{}).cplTarget:0;
    const ref=tgt||avg[x.kind];x.ref=ref;
    const a=x.a;let rec,cls,why;
    if(a.spend<total*0.01&&!a.results){rec="Sin entrega";cls="mute";why="Casi no gasta; revisar o apagar";}
    else if(!ref){rec="Sin referencia";cls="mute";why="";}
    else if(!a.results&&a.spend>=1.5*ref){rec="Pausar";cls="bad";why=`Gastó ${money(a.spend)} sin resultados`;}
    else if(a.cpl>=1.6*ref&&a.spend>=2*ref){rec="Pausar";cls="bad";why=`Costo ${Math.round(a.cpl/ref*100-100)}% sobre la referencia`;}
    else if(a.cpl&&a.cpl<=0.8*ref&&a.results>=5){rec="Escalar";cls="ok";why="Costo bajo y volumen suficiente";}
    else if(a.cpl&&a.cpl<=1.1*ref){rec="Mantener";cls="ok";why="En rango";}
    else if(!a.results){rec="Vigilar";cls="warn";why="Aún sin resultados";}
    else{rec="Ajustar";cls="warn";why="Costo por encima de la referencia";}
    if(a.freq!=null&&a.freq>3)why+=(why?" · ":"")+"frecuencia alta";
    x.rec=rec;x.cls=cls;x.why=why;
  }
  list.sort((p,q)=>q.a.spend-p.a.spend);
  return {list,avg};
}

      return `<tr><td class="l"><a href="#" data-proj="${esc(p.id)}" style="color:inherit;font-weight:700">${esc(p.name)}</a></td><td>${b.budget?money(b.budget):"—"}</td><td>${has?money(x.spend):"—"}</td><td>${b.budget&&has?pct(x.spend/b.budget*100):"—"}</td><td>${has?int(x.results):"—"}</td><td>${has?money(x.cpl):"—"}</td><td>${b.cplTarget?money(b.cplTarget):"—"}</td><td>${pj!=null?int(pj):"—"}</td><td class="l"><span class="pill ${st[0]}">${st[1]}</span></td></tr>`;}).join("")}
    </tbody></table></div></section>`:""}

  <section class="card" aria-labelledby="hAs">
    <div class="sec-tag" id="hAs">CONJUNTOS DE ANUNCIOS</div>
    <p class="note" style="margin-top:0">Referencia de costo: el CPL objetivo del proyecto si está registrado; si no, el promedio del periodo (leads ${money(at.avg.lead)}${at.avg.msg?` · conversaciones ${money(at.avg.msg)}`:""}).</p>
    <div class="tbl-wrap"><table><thead><tr><th>Conjunto</th><th>Gasto</th><th>Result.</th><th>Costo/result.</th><th>Conv.</th><th>Clics</th><th>CTR</th><th>CPC</th><th>Frec.</th><th class="l">Recomendación</th></tr></thead><tbody>
    ${at.list.map(x=>`<tr><td class="name"><strong>${esc(x.adset)}</strong><small>${esc(x.campaign)}${proj==="all"?" · "+esc(projName(x.project)):""} · ${x.kind==="msg"?"WhatsApp":"Formulario"}</small></td><td>${money(x.a.spend)}</td><td>${int(x.a.results)}</td><td>${money(x.a.cpl)}</td><td>${pct(x.a.conv)}</td><td>${int(x.a.clicks)}</td><td>${pct(x.a.ctr)}</td><td>${money(x.a.cpc)}</td><td>${dec(x.a.freq)}</td><td class="l"><span class="pill ${x.cls}">${x.rec}</span>${x.why?`<div class="note">${esc(x.why)}</div>`:""}</td></tr>`).join("")}
    </tbody></table></div>
  </section>
  ${reportsListHTML()}`;
  if($("btnAi"))$("btnAi").onclick=openAi;
  body.querySelectorAll("[data-proj]").forEach(el=>el.onclick=e=>{e.preventDefault();state.proj=el.dataset.proj;render();window.scrollTo({top:0,behavior:"smooth"});});
  bindReportList();
}
function md(t){
  const out=[];let ul=false;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  for(const raw of String(t||"").split("\n")){
    const l=raw.trim();
    if(/^[-•*]\s+/.test(l)){if(!ul){out.push("<ul>");ul=true;}out.push("<li>"+inl(l.replace(/^[-•*]\s+/,""))+"</li>");continue;}
    if(ul){out.push("</ul>");ul=false;}
    if(!l)continue;
    if(/^#{1,4}\s/.test(l))out.push("<h3>"+inl(l.replace(/^#{1,4}\s/,""))+"</h3>");
    else if(l.startsWith("> "))out.push('<p class="note">'+inl(l.slice(2))+"</p>");
    else out.push("<p>"+inl(l)+"</p>");
  }
  if(ul)out.push("</ul>");
  return out.join("");
}
function aiHTML(month,proj){
  const a=state.analyses[month+"_"+proj];
  if(!a||!a.text)return `<p class="muted">Todavía no hay análisis para ${esc(proj==="all"?"Incol":projName(proj))} en ${esc(monthLabel(month))}.${state.canWrite?" Usa “Editar análisis” para pegarlo.":""}</p>`;
  return md(a.text)+(a.date?`<div class="src">Actualizado el ${esc(a.date)}</div>`:"");
}

function setWrite(on){state.canWrite=on;["btnBudget","btnUpload"].forEach(i=>$(i).hidden=!on);$("btnGh").textContent=on?"GitHub conectado":"Conectar GitHub";}
function reportsListHTML(){
  const reps=Object.entries(state.reports).sort((a,b)=>(b[1].month+b[1].project).localeCompare(a[1].month+a[1].project));
  if(!reps.length)return"";
  return `<section class="card" aria-labelledby="hRl"><div class="sec-tag" id="hRl">INFORMES CARGADOS</div><div class="reports-list">${reps.map(([id,r])=>`<div class="rep" data-rep="${esc(id)}"><span class="grow"><strong>${esc(projName(r.project))}</strong> · ${esc(monthLabel(r.month))}<br><span class="note">${esc(r.fileName||"")} · ${int((r.rows||[]).length)} conjuntos · ${esc(r.repStart||"")} a ${esc(r.repEnd||"")}${r.uploadedAt?" · cargado "+esc(r.uploadedAt.slice(0,10)):""}</span></span>${state.canWrite?`<button type="button" class="del">Eliminar</button>`:""}</div>`).join("")}</div></section>`;
}
function bindReportList(){
  document.querySelectorAll(".rep .del").forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.closest(".rep").dataset.rep;
      if(btn.dataset.confirm!=="1"){btn.dataset.confirm="1";btn.textContent="¿Seguro? Eliminar";btn.classList.add("primary");setTimeout(()=>{if(btn.isConnected){btn.dataset.confirm="";btn.textContent="Eliminar";btn.classList.remove("primary");}},4000);return;}
      btn.disabled=true;
      try{await saveData(d=>{delete d.reports[id];},"Eliminar informe "+id);render();}catch(e){btn.disabled=false;btn.textContent="No se pudo eliminar";}
    };
  });
}

/* ---------- dialogs ---------- */
function openDlg(html){const ov=$("overlay");ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;ov.hidden=false;ov.onclick=e=>{if(e.target===ov)closeDlg();};return ov.firstChild;}
function closeDlg(){const ov=$("overlay");ov.hidden=true;ov.innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeDlg();});

function openBudget(){
  if(!state.canWrite)return;
  const m=state.month;const b=(state.budgets[m]||{}).projects||{};
  const d=openDlg(`<h2>Registrar presupuesto</h2>
  <label>Mes<input type="month" id="bMonth" value="${m}"></label>
  <p class="note">Por proyecto: presupuesto del mes y meta de resultados o CPL objetivo. Si pones presupuesto y CPL objetivo, la meta se calcula sola.</p>
  <div class="grid-form" id="bRows"></div>
  <div id="bMsg"></div>
  <div class="row-end"><button type="button" id="bCancel">Cancelar</button><button type="button" class="primary" id="bSave">Guardar</button></div>`);
  const fill=mm=>{const bb=(state.budgets[mm]||{}).projects||{};$("bRows").innerHTML=state.projects.map(p=>{const x=bb[p.id]||{};return `<div class="prow"><strong class="pn">${esc(p.name)}</strong><label>Presupuesto (COP)<input inputmode="numeric" id="bb_${p.id}" value="${x.budget?nf0.format(x.budget):""}" placeholder="0"></label><label>Meta resultados<input inputmode="numeric" id="bg_${p.id}" value="${x.goal||""}" placeholder="opcional"></label><label>CPL objetivo<input inputmode="numeric" id="bt_${p.id}" value="${x.cplTarget?nf0.format(x.cplTarget):""}" placeholder="opcional"></label></div>`;}).join("");};
  fill(m);
  $("bMonth").onchange=e=>fill(e.target.value);
  $("bCancel").onclick=closeDlg;
  $("bSave").onclick=async()=>{
    const mm=$("bMonth").value;if(!/^\d{4}-\d{2}$/.test(mm)){$("bMsg").innerHTML=`<div class="msg bad">Elige un mes.</div>`;return;}
    const projects={};
    for(const p of state.projects){const bv=num($("bb_"+p.id).value),gv=num($("bg_"+p.id).value),tv=num($("bt_"+p.id).value);
      if(bv||gv||tv)projects[p.id]={budget:bv||0,goal:gv||0,cplTarget:tv||0};}
    $("bSave").disabled=true;
    try{await saveData(d=>{d.budgets=d.budgets||{};d.budgets[mm]={month:mm,projects,updatedAt:new Date().toISOString()};},"Presupuesto "+mm);state.month=mm;closeDlg();render();}
    catch(e){$("bSave").disabled=false;$("bMsg").innerHTML=`<div class="msg bad">${esc(e.message)}</div>`;}
  };
}

function openUpload(){
  if(!state.canWrite)return;
  const d=openDlg(`<h2>Cargar informe de Meta Ads</h2>
  <label>Proyecto<select id="uProj"><option value="auto">Detectar por nombre de campaña</option>${state.projects.map(p=>`<option value="${p.id}" ${state.proj===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
  <div class="drop" id="uDrop"><strong>Arrastra el Excel aquí</strong><span class="note">o</span><input type="file" id="uFile" accept=".xlsx,.xls,.csv"><span class="note">Exporta desde el Administrador de anuncios a nivel de conjunto de anuncios. El mes se toma de “Inicio del informe”.</span></div>
  <div id="uPrev"></div>
  <div class="row-end"><button type="button" id="uCancel">Cancelar</button><button type="button" class="primary" id="uSave" disabled>Guardar informe</button></div>`);
  let parsed=null,fileName="";
  $("uCancel").onclick=closeDlg;
  const drop=$("uDrop");
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("on");};
  drop.ondragleave=()=>drop.classList.remove("on");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");if(e.dataTransfer.files[0])handle(e.dataTransfer.files[0]);};
  $("uFile").onchange=e=>{if(e.target.files[0])handle(e.target.files[0]);};
  $("uProj").onchange=()=>{if(parsed)preview();};
  async function handle(f){
    fileName=f.name;$("uPrev").innerHTML=`<div class="msg warn">Leyendo ${esc(f.name)}…</div>`;
    try{
      if(typeof XLSX==="undefined")throw new Error("No cargó el lector de Excel. Recarga la página.");
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:false});
      parsed=parseWorkbook(wb);
      if(!parsed.rows.length)throw new Error("El archivo no tiene filas con gasto.");
      preview();
    }catch(e){parsed=null;$("uSave").disabled=true;$("uPrev").innerHTML=`<div class="msg bad">${esc(e.message)}</div>`;}
  }
  function groups(){
    const sel=$("uProj").value,g={},un=[];
    for(const r of parsed.rows){
      const pid=sel==="auto"?detectProject(r.campaign):sel;
      const start=r.repStart||new Date().toISOString().slice(0,10);
      if(!pid){un.push(r);continue;}
      const k=start.slice(0,7)+"_"+pid;(g[k]=g[k]||{month:start.slice(0,7),project:pid,rows:[]}).rows.push(r);
    }
    return {g,un};
  }
  function preview(){
    const {g,un}=groups();
    const items=Object.entries(g);
    $("uPrev").innerHTML=`<div class="grid-form">${items.map(([k,x])=>{const a=agg(x.rows);const exists=state.reports[k];return `<div class="msg ok"><strong>${esc(projName(x.project))} · ${esc(monthLabel(x.month))}</strong> — ${x.rows.length} conjuntos · ${money(a.spend)} · ${int(a.results)} resultados${exists?" · reemplaza el informe que ya estaba":""}</div>`;}).join("")}
    ${un.length?`<div class="msg warn">${un.length} filas sin proyecto (no reconocí el nombre de campaña): ${esc([...new Set(un.map(r=>r.campaign))].slice(0,4).join(", "))}. Elige el proyecto arriba para incluirlas.</div>`:""}
    <div class="note">Hoja leída: ${esc(parsed.sheet)}</div></div>`;
    $("uSave").disabled=!items.length;
  }
  $("uSave").onclick=async()=>{
    const {g}=groups();$("uSave").disabled=true;
    try{
      const docs={};
      for(const [k,x] of Object.entries(g)){
        const starts=x.rows.map(r=>r.repStart).filter(Boolean).sort(),ends=x.rows.map(r=>r.repEnd).filter(Boolean).sort();
        docs[k]={month:x.month,project:x.project,platform:"meta",fileName,uploadedAt:new Date().toISOString(),repStart:starts[0]||null,repEnd:ends[ends.length-1]||null,rows:x.rows};
        state.month=x.month;
      }
      await saveData(d=>{d.reports=d.reports||{};Object.assign(d.reports,docs);},"Informe "+Object.keys(docs).join(", "));
      if($("uProj").value!=="auto")state.proj=$("uProj").value;
      closeDlg();render();
    }catch(e){$("uSave").disabled=false;$("uPrev").insertAdjacentHTML("beforeend",`<div class="msg bad">No se pudo guardar (${esc(e.code||e.message)}).</div>`);}
  };
}

function aiText(){
  const month=state.month,proj=state.proj;const reps=reportsFor(month,proj);const rows=rowsOf(reps);const a=agg(rows);const bud=budgetFor(month,proj);
  const at=adsetTable(rows,bud);
  const L=[];
  L.push(`REPORTE META ADS – ${proj==="all"?"INCOL (todos los proyectos)":"INCOL – "+projName(proj).toUpperCase()}`);
  const ends=reps.map(r=>r.repEnd).filter(Boolean).sort(),starts=reps.map(r=>r.repStart).filter(Boolean).sort();
  L.push(`Periodo: ${starts[0]||"?"} a ${ends[ends.length-1]||"?"} | Moneda: COP`);
  L.push("");L.push("RESUMEN");
  if(bud.budget)L.push(`- Presupuesto del mes: ${money(bud.budget)} | Invertido: ${money(a.spend)} | Restante: ${money(bud.budget-a.spend)}`);else L.push(`- Inversión: ${money(a.spend)}`);
  if(bud.goal)L.push(`- Meta: ${int(bud.goal)} resultados | CPL objetivo: ${money(bud.cplTarget)}`);
  L.push(`- Resultados: ${int(a.results)} (${int(a.leads)} leads de formulario${a.msgs?`, ${int(a.msgs)} conversaciones WhatsApp`:""}) | Costo por resultado: ${money(a.cpl)}`);
  L.push(`- Clics únicos en el enlace: ${int(a.clicks)} | CTR único: ${pct(a.ctr)} | CPC: ${money(a.cpc)}`);
  L.push(`- Tasa conversión formulario: ${pct(a.conv)} | Frecuencia: ${dec(a.freq)} | % Reprod. 3 s: ${pct(a.p3s)} | Tiempo medio video: ${a.vavg==null?"—":dec(a.vavg)+" s"}`);
  const byC={};for(const x of at.list){const k=(proj==="all"?projName(x.project)+" › ":"")+x.campaign;(byC[k]=byC[k]||[]).push(x);}
  for(const [c,xs] of Object.entries(byC)){
    const ca=agg(xs.flatMap(x=>x.rows));
    L.push("");L.push(`CAMPAÑA: ${c} (${xs[0].kind==="msg"?"conversaciones WhatsApp":"clientes potenciales – formulario"})`);
    L.push(`Subtotal: Inversión ${money(ca.spend)} | Resultados ${int(ca.results)} | Costo/result. ${money(ca.cpl)} | Clics ${int(ca.clicks)} | CPC ${money(ca.cpc)}`);
    xs.forEach((x,i)=>L.push(`${i+1}. ${x.adset}: Inversión ${money(x.a.spend)} | Resultados ${int(x.a.results)} | Costo/result. ${money(x.a.cpl)} | Conv. ${pct(x.a.conv)} | Clics ${int(x.a.clicks)} | CTR ${pct(x.a.ctr)} | CPC ${money(x.a.cpc)} | Repr. 3s ${int(x.a.v3s)} | Frec. ${dec(x.a.freq)}`));
  }
  return L.join("\n");
}
function openText(){
  const t=aiText();
  openDlg(`<h2>Resumen en texto</h2><p class="note">Resumen del proyecto y mes seleccionados, listo para copiar.</p><textarea id="tTxt" readonly></textarea><div id="tMsg"></div><div class="row-end"><button type="button" id="tClose">Cerrar</button><button type="button" class="primary" id="tCopy">Copiar</button></div>`);
  $("tTxt").value=t;$("tClose").onclick=closeDlg;
  $("tCopy").onclick=()=>{navigator.clipboard.writeText(t).then(()=>{$("tMsg").innerHTML=`<div class="msg ok">Copiado.</div>`;}).catch(()=>{const ta=$("tTxt");ta.focus();ta.select();$("tMsg").innerHTML=`<div class="msg warn">Selecciónalo y cópialo con Ctrl+C.</div>`;});};
}
$("btnBudget").onclick=openBudget;$("btnUpload").onclick=openUpload;$("btnText").onclick=openText;$("btnGh").onclick=openGh;

/* ---------- data ---------- */
render();
(async()=>{
  setWrite(false);
  let loaded=false;
  if(ghToken){try{const {data}=await ghGet();applyData(data);setWrite(true);loaded=true;}catch(e){}}
  if(!loaded){try{const r=await fetch("data.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);applyData(await r.json());}
    catch(e){$("body").insertAdjacentHTML("beforebegin",`<div class="card msg bad">No se pudieron cargar los datos (data.json).</div>`);}}
  state.ready=true;render();
})();
})();
</script>
